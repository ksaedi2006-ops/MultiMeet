# Render's free tier sleeps after 15 idle minutes; a ping every few minutes keeps the API awake,
# so a visitor never waits for a cold start. Set the repository variable BACKEND_URL
# (Settings > Secrets and variables > Actions > Variables), e.g. https://multimeet-api.onrender.com
name: keep-alive
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    if: ${{ vars.BACKEND_URL != '' }}
    steps:
      - run: curl -fsS --max-time 60 "${{ vars.BACKEND_URL }}/health"
